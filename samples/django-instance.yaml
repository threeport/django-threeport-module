# A Django instance deployed from an existing definition.
#
#   tptctl django create django-instance -c samples/django-instance.yaml
DjangoInstance:
  Name: myapp-dev
  DjangoDefinition:
    Name: myapp
  # KubernetesRuntimeInstance is optional. Left out, as it is here, a create
  # puts the instance on the control plane's default runtime, which is what a
  # single-cluster install wants. Name one to deploy somewhere else:
  #
  #   KubernetesRuntimeInstance:
  #     Name: my-runtime
  #
  # A replace leaves the instance on the runtime it is already on, whether or
  # not this field is set, so editing another field here cannot move a running
  # workload to a different cluster. Naming a different runtime in a replace is
  # reported as an error rather than performed.

  # Environment variables for this instance only, layered on top of the
  # definition's. A name set on both takes the value given here. SecretEnvVars
  # reference secrets you create in the target namespace beforehand. Applied
  # when the instance is created and cannot be changed by a replace.
  #
  #   Env:
  #     - FEATURE_X=on
  #   SecretEnvVars:
  #     - Name: POSTMARK_API_KEY
  #       SecretName: myapp-prod-postmark
  #       SecretKey: api-key
